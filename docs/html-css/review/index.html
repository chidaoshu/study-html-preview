<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML・CSS 期末対策</title>
<style>
  :root{--ink:#1a1a1a;--muted:#666;--line:#ddd;--bg:#fff;--accent:#b2452c;}
  @media (prefers-color-scheme:dark){:root{--ink:#e8e8e8;--muted:#aaa;--line:#444;--bg:#111;}}
  *{box-sizing:border-box}
  body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);max-width:720px;margin:0 auto;padding:2rem 1rem;line-height:1.6}
  h1{font-size:1.5rem;margin-bottom:.5rem}
  p.muted{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
  .vol-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem}
  .vol-list a{display:block;padding:.6rem .8rem;border:1px solid var(--line);border-radius:.4rem;text-decoration:none;color:var(--ink);text-align:center;transition:border-color .15s}
  .vol-list a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<h1>HTML・CSS 期末対策</h1>
<p class="muted">試験範囲：vol.1〜14（vol.13 は1.2まで、vol.14 は1.3まで）</p>

  <a href="vol.12.html">vol.12</a>
  <a href="vol.13.html">vol.13</a>
  <a href="vol.14.html">vol.14</a>
</nav>
</body>
</html>
