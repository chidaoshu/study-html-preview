<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIT — 骨格リファレンス</title>
<style>
/* =========================================================
   [1] テーマ  ★構造は変えない。色の値だけ差し替える★
   固定ライト。暗色モードの切替は廃止。
   ========================================================= */
:root{
  --bg:#ffffff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e0e0e0;
  --surface:#f7f7f5; --accent:#b03030;   /* accent は差分表示にだけ使う */
  --demo-bg:#ffffff; --demo-fg:#1a1a1a;  /* デモ内部の色。常に読める組み合わせに */
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium",sans-serif;
  line-height:1.7; text-wrap:pretty;
  -webkit-text-size-adjust:100%;
}
code,pre,.mono{font-family:"SF Mono","Menlo","Consolas",monospace}

/* =========================================================
   [2] レスポンシブの器  ★2つの視口を等しく扱う★
   モバイル: 1カラム縦積み / デスクトップ: コードと描画を左右に並べる
   ========================================================= */
.wrap{max-width:1160px; margin:0 auto; padding:0 16px}
@media (min-width:900px){ .wrap{padding:0 32px} }

.card{border-top:1px solid var(--line); padding:28px 0}
.card-body{display:grid; gap:16px}
@media (min-width:900px){
  /* デスクトップでは横幅を使う。細い1カラムのまま放置しないこと */
  .card-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start}
}

/* =========================================================
   [3] タブ  ★このJSと data 属性の対応は変更禁止★
   パネルは最初から全部 HTML に書いてあり、表示を切り替えるだけ。
   iframe は再生成しない → 切替バグが構造的に起きない。
   ========================================================= */
.tabs{display:flex; flex-wrap:wrap; gap:2px; margin-bottom:16px}
.tab{
  font:inherit; font-size:14px; cursor:pointer;
  padding:7px 14px; border:1px solid var(--line); background:transparent;
  color:var(--muted); border-radius:0;
}
.tab:hover{color:var(--fg)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tab[aria-selected="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.panel[hidden]{display:none}

/* =========================================================
   [4] デモ枠  ★ページの装飾とデモの効果を混同させない★
   iframe srcdoc なのでページCSSは中に入らない。
   枠は最小限の1本線＋ラベルだけにし、影・角丸・色面で飾らない。
   ========================================================= */
.demo{border:1px solid var(--line); background:var(--demo-bg)}
.demo iframe{display:block; width:100%; border:0; background:var(--demo-bg)}

/* [5] コード */
pre.code{
  margin:0; padding:14px; overflow-x:auto; font-size:13px; line-height:1.65;
  background:var(--surface); border:1px solid var(--line); white-space:pre;
}
.hl{color:var(--accent); font-weight:600}   /* 差分行だけに使う */

/* [6] ヘッダ */
.top{
  position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:16px; padding:10px 16px;
}
.volnav{display:flex; gap:10px; overflow-x:auto; font-size:13px}
.volnav a{color:var(--muted); text-decoration:none; white-space:nowrap}
.volnav a[aria-current="page"]{color:var(--fg); font-weight:600}
</style>
</head>
<body>

<header class="top">
  <strong style="font-size:14px">HTML&amp;CSS</strong>
  <nav class="volnav">
    <a href="#" aria-current="page">vol.8</a><a href="#">9</a><a href="#">10</a>
    <a href="#">11</a><a href="#">12</a><a href="#">13</a><a href="#">14</a>
  </nav>
</header>

<main class="wrap">

  <!-- ============ カード例（この構造をコピーして使う） ============ -->
  <section class="card" data-tabs>
    <h2 style="font-size:17px;margin:0 0 4px">2.6　結合子 <span style="color:var(--muted);font-weight:400">/ Combinators</span></h2>
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">HTML は不変。セレクターだけが変わる。</p>

    <!-- タブ: data-tab の値が panel の data-panel と一致すること -->
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-tab="d" aria-selected="true">子孫（空白）</button>
      <button class="tab" role="tab" type="button" data-tab="c" aria-selected="false">子（&gt;）</button>
    </div>

    <!-- パネル: 先頭以外に hidden を付ける -->
    <div class="panel" data-panel="d">
      <div class="card-body">
        <pre class="code"><span class="hl">.area p</span> { color: blue; }</pre>
        <div class="demo">
          <iframe title="子孫結合子" height="150" srcdoc='<!DOCTYPE html><meta charset="utf-8"><style>body{font:14px/1.6 sans-serif;margin:8px;color:#1a1a1a}.area p{color:blue}</style><div class="area"><p>1. 直下の段落</p><div class="group"><p>2. 孫の段落</p></div></div>'></iframe>
        </div>
      </div>
    </div>

    <div class="panel" data-panel="c" hidden>
      <div class="card-body">
        <pre class="code"><span class="hl">.area &gt; p</span> { color: blue; }</pre>
        <div class="demo">
          <iframe title="子結合子" height="150" srcdoc='<!DOCTYPE html><meta charset="utf-8"><style>body{font:14px/1.6 sans-serif;margin:8px;color:#1a1a1a}.area>p{color:blue}</style><div class="area"><p>1. 直下の段落</p><div class="group"><p>2. 孫の段落</p></div></div>'></iframe>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
/* ★このスクリプトは一行も変更しない。丸ごとコピーすること★ */

/* タブ: [data-tabs] ごとにスコープされる。カードが何枚あっても干渉しない */
document.querySelectorAll('[data-tabs]').forEach(function (group) {
  var tabs = group.querySelectorAll(':scope > .tabs > .tab');
  var panels = group.querySelectorAll(':scope > .panel');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      var key = tab.dataset.tab;
      tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t === tab)); });
      panels.forEach(function (p) { p.hidden = (p.dataset.panel !== key); });
    });
  });
});

/* テーマ固定（ライト）。切替機能は廃止 */
</script>
</body>
</html>
